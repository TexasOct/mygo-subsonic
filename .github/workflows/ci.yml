name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed bundle is current
        run: git diff --exit-code -- index.js
      - run: npm run package
      - uses: actions/upload-artifact@v7
        if: matrix.node == 24
        with:
          name: mygo-subsonic
          path: dist/*.zip
          if-no-files-found: error
